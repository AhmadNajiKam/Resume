[project]
name = "resume"
version = "0.1.0"
description = "This package will be used to genearte resumes from YAML files"
authors = [
    {name = "Ahmad Naji Mahmoud Kamamji",email = "ahmadnajikam@gmail.com"}
]
license = "AGPL"
requires-python = ">=3.14"
dependencies = [
    "jinja2 (>=3.1.6,<4.0.0)",
    "pypandoc-binary (>=1.17,<2.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[dependency-groups]
dev = [
    "pypandoc-binary (>=1.17,<2.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
